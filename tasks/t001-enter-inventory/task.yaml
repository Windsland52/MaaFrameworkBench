schema_version: 1
id: t001-enter-inventory
kind: fix
covers: [1.3.1, 2.1.2, 2.1.4, 2.1.5]

env:
  type: frames
  dataset: maafw-demo-frames # 环境自带画面；agent 看不到全部
  dir: maafw-demo-frames # datasets.yaml 的 target，相对 data_root
  screens:
    - name: home
      path: home.png
      transitions:
        - area: [140, 300, 320, 140] # STOCK 按钮
          target: inventory
    - name: inventory
      path: inventory.png
      transitions:
        - area: [1040, 480, 320, 140] # BACK 按钮
          target: home
    - name: inventory-zero
      path: inventory-zero.png # held-out 变体：同屏、数量不同

visible: [tasks/t001-enter-inventory/visible/]
entry: Main.Start

prompt: |
  frames/ 下是本任务的画面素材，和"被评测应用"运行时看到的屏幕一致。

  要求：从 HOME 屏进入 INVENTORY 屏，然后答出那一屏上序号显示的数量。
  产出一份能跑通的 pipeline（写进 resource/base/pipeline/），入口节点为 Main.Start。

  可用资源：
    - resource/base 是资源包根目录（pipeline/ 与 image/ 都在这一层）
    - OCR 模型已经加载好，节点里可以直接用 recognition: OCR
    - 屏幕尺寸 1280x720

  注意：画面只有在点中真正的按钮时才会切换；点到别处画面不变。

budget:
  wall_ms: 120000
  max_screencaps: 200

assert:
  - kind: env_state
    path: screen
    equals: inventory
  - kind: node_hit
    order: [Main.Start, Main.AtInventory, Main.Quantity]
  - kind: reco_text
    node: Main.Quantity
    equals: '12' # agent 答出的数量；held-out 变体上这个值不同
  - kind: op_count
    max_screencaps: 30

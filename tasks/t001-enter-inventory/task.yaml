schema_version: 1
id: t001-enter-inventory
kind: fix
covers: [1.3.1, 2.1.2, 2.1.4, 2.1.5]

env:
  type: frames
  dataset: maafw-demo-frames # 环境自带画面；agent 看不到全部
  dir: maafw-demo-frames # datasets.yaml 的 target，相对 data_root
  screens:
    - name: home
      path: 2026.09.18-21.07.41.318.png
      transitions:
        - area: [140, 300, 320, 140] # STOCK 按钮
          target: inventory
    - name: inventory
      path: 2026.09.18-21.07.46.902.png
      transitions:
        - area: [1040, 480, 320, 140] # BACK 按钮
          target: home
    - name: inventory-zero
      path: 2026.09.18-21.07.52.477.png # held-out 变体：同屏、数量不同

visible: [2026.09.18-21.07.41.318.png] # 数据集里的帧；物化到工作区的 frames/ 下
entry: Main.Start

prompt: |
  frames/ 下是本任务的画面素材，和"被评测应用"运行时看到的屏幕一致。

  要求：从 HOME 屏进入 INVENTORY 屏，然后答出那一屏上序号显示的数量。
  产出一份能跑通的 pipeline（写进 resource/base/pipeline/），入口节点为 Main.Start。
  按钮要靠识别定位，不要写死坐标。

  可用资源：
    - resource/base 是资源包根目录（pipeline/ 与 image/ 都在这一层）
    - OCR 模型已经加载好，节点里可以直接用 recognition: OCR
    - 屏幕尺寸 1280x720

  注意：画面只有在点中真正的按钮时才会切换；点到别处画面不变。

budget:
  wall_ms: 120000
  max_screencaps: 200
  # 每个节点的识别等待上限，起跑前注入成 Default.timeout。
  # 不写 = 框架默认 20 秒 —— 失败用例会因此贵 6 倍（实测 23.1s vs 3.6s），而失败在评测里是常态。
  node_timeout_ms: 3000

# 断言只锚定**题面约定过的名字**。Main.Start 是 prompt 里写死的入口；
# 其余节点叫什么都不判 —— 那属于实现风格，换个命名就挂的判据判错了东西。
assert:
  - kind: env_state
    path: screen
    equals: inventory
  - kind: node_hit
    required: [Main.Start]
  - kind: reco_text # 不写 node：这一跑里任何节点读到过这个值就算
    equals: '12' # held-out 变体上是另一个值
  - kind: op_count
    max_screencaps: 30
